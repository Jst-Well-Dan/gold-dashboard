name: 更新看板

# 每次运行：抓数 → 计算 → 生成 docs/index.html 与 docs/status.html → 提交数据 → 发布到 GitHub Pages
#
# 持久层的分工：
#   data/raw/ + data/fetch_manifest.json + data/board.json  → **提交进仓库**
#     原始 CSV 是排查 bug 的唯一证据链（那次运行到底写了什么、哪个源退化了），
#     台账是 TTL 判断的唯一依据。CSV 都是追加型，git 只存新增那一行的 delta，
#     实测每天约 7 KB，一年 2~3 MB —— 比它在排查时省下的时间便宜得多。
#     顺带解决两件事：本地 `git pull` 就能拿到线上那份数据；每天有提交，
#     不会触发 GitHub「60 天无提交自动停用定时任务」。
#   docs/  → **不提交**，只走 Pages artifact
#     1.6 MB 单文件，每天整篇重排，delta 压不动（实测 11 个版本已占 7.7 MB）。
#
# 早期的做法是把 data/ 放进 actions/cache 当持久层。已废除：cache 不可下载、
# 不可 diff，本地与线上各存一份互不相通的台账，而且固定 key 只能写一次的坑很难记。

on:
  schedule:
    # 主拍：每交易日一次。UTC 22:00 = 北京时间次日 06:00，此时美国前一交易日的
    # 收盘数据（FRED H.15、CBOE）已经发布完毕。
    # UTC 周一 22:00 → 北京周二 06:00（拿周一数据），依此类推。
    - cron: '0 22 * * 1-5'

    # 补拍：GitHub 的 schedule 对 public 仓库会降级（实测每天只肯落地 0–1 次、
    # 且延迟 7–10 小时，可能跨过北京午夜）。主拍迟到或被丢弃时靠这两拍兜底，
    # 对应北京 08:00 / 10:00。重复跑几乎零成本：TTL 让大部分接口直接跳过
    # （实测 21 抓 / 19 跳过 / 0 失败，全程 21.5s），页面是「最新状态」而非按天产物，
    # 多跑一次不会重复出页。
    - cron: '0 0,2 * * 2-6'
  workflow_dispatch:
    inputs:
      force:
        description: '强制全量重抓（忽略 TTL，约 2.5 分钟）'
        type: boolean
        default: false
  push:
    branches: [master, main]
    paths:
      - 'scripts/**'
      - 'web/**'
      - 'requirements.txt'
      - '.github/workflows/daily.yml'

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: write   # 提交 data/ 下的抓取结果（每天一次）
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 抓数 → 计算 → 出页面
        run: |
          if [ "${{ inputs.force }}" = "true" ]; then
            python scripts/run_daily.py --force
          else
            python scripts/run_daily.py
          fi

      # 数据入库。注意这里提交的路径与下面 on.push.paths 里的任何一项都不重叠，
      # 所以这次提交不会反过来触发一次运行（避免自我触发的死循环）。
      - name: 提交数据变化
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data
          if git diff --cached --quiet; then
            echo "数据无变化，跳过提交"
            exit 0
          fi
          git diff --cached --stat | tail -3
          git commit -m "chore(data): 抓取 $(date -u +%Y-%m-%dT%H:%MZ)"
          # 两个补拍可能与主拍撞车（concurrency 已串行，但排队时基commit 可能已变），
          # 冲突就 rebase 后重推。数据文件之间不重叠，rebase 不会产生实质冲突。
          for i in 1 2 3; do
            git push origin HEAD:${GITHUB_REF_NAME} && exit 0
            echo "push 失败（第 $i 次），rebase 后重试"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
            sleep 5
          done
          echo "::error::数据提交推送失败；下次运行会自动重抓，不会丢数据"
          exit 1

      - name: 打包站点
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 发布到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
