name: 更新看板

# 每次运行：抓数 → 计算 → 生成 docs/index.html 与 docs/status.html → 发布到 GitHub Pages
#
# 部署方式：Pages 用 artifact（Source = GitHub Actions），**不提交 docs/**。
# 原因：docs/index.html 是 1.6 MB 的单文件，每天提交一次会让 .git 持续膨胀
# （实测 11 个版本已占 7.7 MB），长期 clone 会很难受。
#
# 仍然提交的只有 data/fetch_manifest.json（约 20 KB）：它是 TTL 判断的唯一依据，
# 跨运行必须持久，而且 git 历史本身就是一份运行记录。

on:
  schedule:
    # 每交易日一次。UTC 22:00 = 北京时间次日 06:00，此时美国前一交易日的
    # 收盘数据（FRED H.15、CBOE）已经发布完毕。
    # UTC 周一 22:00 → 北京周二 06:00（拿周一数据），依此类推。
    - cron: '0 22 * * 1-5'
  workflow_dispatch:
    inputs:
      force:
        description: '强制全量重抓（忽略 TTL，约 2.5 分钟）'
        type: boolean
        default: false
  push:
    branches: [master, main]
    paths:
      - 'scripts/**'
      - 'web/**'
      - 'requirements.txt'
      - '.github/workflows/daily.yml'

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: write   # 只为下面的心跳提交（其余流程不产生提交）
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 恢复原始数据与台账（跨运行持久层）
        uses: actions/cache@v4
        with:
          path: |
            data/raw
            data/fetch_manifest.json
          # 每次用新的 key 才会真正写回缓存；restore-keys 前缀匹配到最近的一份。
          # 固定 key 只能写一次，之后永远恢复第一次的数据，是这里唯一的坑。
          key: raw-${{ github.run_id }}
          restore-keys: |
            raw-

      - name: 抓数 → 计算 → 出页面
        run: |
          if [ "${{ inputs.force }}" = "true" ]; then
            python scripts/run_daily.py --force
          else
            python scripts/run_daily.py
          fi

      - name: 打包站点
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      # GitHub 会在仓库 60 天无提交后自动停用定时任务。本仓库平时零提交（产物都走
      # cache / artifact），所以隔一个半月补一次心跳。失败不影响部署。
      - name: 心跳（避开 60 天无提交被停用定时任务）
        continue-on-error: true
        if: github.ref == 'refs/heads/master'
        run: |
          DAYS=$(( ( $(date +%s) - $(git log -1 --format=%ct) ) / 86400 ))
          echo "距上次提交 ${DAYS} 天"
          if [ "$DAYS" -lt 45 ]; then
            echo "不需心跳"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .heartbeat
          git add .heartbeat
          git commit -m "chore: 心跳 $(date -u +%Y-%m-%d)（GitHub 会在 60 天无提交后停用定时任务）"
          git push

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 发布到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
